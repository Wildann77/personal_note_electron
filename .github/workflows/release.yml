name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to attach release assets to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          npm ci --ignore-scripts
          node -e "fs.copyFileSync('node_modules/electron-winstaller/vendor/7z-x64.exe', 'node_modules/electron-winstaller/vendor/7z.exe'); fs.copyFileSync('node_modules/electron-winstaller/vendor/7z-x64.dll', 'node_modules/electron-winstaller/vendor/7z.dll')"

      - name: Install dependencies (macOS & Linux)
        if: runner.os != 'Windows'
        run: npm ci

      - run: npx @electron/rebuild

      - name: Clean extraneous prebuilds for Linux RPM
        if: runner.os == 'Linux'
        run: node -e "fs.rmSync('node_modules/better-sqlite3/prebuilds', { recursive: true, force: true })"

      - run: npm run make

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || 'v1.0.0' }}
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/**/*.zip
            out/make/**/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
